<script>
let name = localStorage.getItem("username");
let photo = localStorage.getItem("profilePic");

if(!name){
    window.location.href = "login.html";
}

// SET STORY
document.getElementById("storyName").innerText = name;
document.getElementById("storyPic").src = photo;

// LIKE BUTTON
function like(btn){
    btn.innerHTML = "💖 Liked";
}
async function uploadPost(){
    let file = document.getElementById("postFile").files[0];
    let caption = document.getElementById("caption").value;

    let reader = new FileReader();

    reader.onload = async function(){
        let res = await fetch("http://localhost:5000/api/posts", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                userId: localStorage.getItem("userId"),
                username: localStorage.getItem("username"),
                media: reader.result,
                type: file.type.startsWith("video") ? "video" : "image",
                caption: caption
            })
        });

        loadPosts();
    };

    reader.readAsDataURL(file);
}
</script>
<link rel="stylesheet" href="style.css">
<div id="feed"></div>

<script>
async function loadPosts(){
    let res = await fetch("http://localhost:5000/api/posts");
    let posts = await res.json();

    let feed = document.getElementById("feed");
    feed.innerHTML = "";

    posts.forEach(post => {
        let media = post.type === "video"
        ? `<video controls src="${post.media}" style="width:100%"></video>`
        : `<img src="${post.media}" style="width:100%">`;

        feed.innerHTML += `
        <div class="post">
            <h4>${post.username}</h4>
            <p>${post.caption}</p>
            ${media}
            <button onclick="likePost('${post._id}')">❤️ ${post.likes.length}</button>
        </div>
        `;
    });
}


async function updateProfile(){
    let userId = localStorage.getItem("userId");

    let newName = document.getElementById("name").value;
    let newUsername = document.getElementById("username").value;

    let res = await fetch(`http://localhost:5000/api/user/${userId}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            fullname: newName,
            username: newUsername
        })
    });

    let data = await res.json();

    localStorage.setItem("username", data.username);

    alert("Profile updated!");
}
async function loadUser(){
    let userId = localStorage.getItem("userId");

    let res = await fetch(`http://localhost:5000/api/user/${userId}`);
    let user = await res.json();

    document.getElementById("name").value = user.fullname;
    document.getElementById("username").value = user.username;
}
