<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Attractive Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    overflow:hidden;
}

/* Glass Card */
.container{
    width:350px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    box-shadow:0 25px 45px rgba(0,0,0,0.2);
    text-align:center;
    animation:fadeIn 1s ease;
}

h2{
    color:#fff;
    margin-bottom:30px;
}

.inputBox{
    position:relative;
    margin-bottom:30px;
}

.inputBox input{
    width:100%;
    padding:10px 0;
    background:transparent;
    border:none;
    border-bottom:2px solid #fff;
    color:#fff;
    outline:none;
    font-size:16px;
}

.inputBox label{
    position:absolute;
    top:0;
    left:0;
    color:#fff;
    pointer-events:none;
    transition:0.5s;
}

.inputBox input:focus ~ label,
.inputBox input:valid ~ label{
    top:-20px;
    font-size:12px;
    color:#00f7ff;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#00f7ff,#00ff88);
    color:#000;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #00ffcc;
}

.extra{
    margin-top:15px;
    color:#fff;
    font-size:14px;
}

.extra a{
    color:#00f7ff;
    text-decoration:none;
}

/* Background floating bubbles */
.bubble{
    position:absolute;
    bottom:-100px;
    width:40px;
    height:40px;
    background:rgba(255,255,255,0.2);
    border-radius:50%;
    animation:rise 10s infinite ease-in;
}

@keyframes rise{
    0%{transform:translateY(0) scale(1);opacity:0.5;}
    100%{transform:translateY(-1200px) scale(0.5);opacity:0;}
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="container">
    <h1>Spidyzz😍</h1>
    <h2>Login</h2>
    <form onsubmit="return login()" >
    <div class="inputBox">
        <input type="text" id="username" required>
        <label>Username</label>
    </div>

    <div class="inputBox">
        <input type="password" id="password" required>
        <label>Password</label>
    </div>

    <button type="button" onclick="login()">Login</button>

    <div class="extra">
        <p>Don't have an account? <a href="register.html">Register</a></p>
    </div>
</form>
</div>

<!-- Bubbles -->
<script>
function createBubbles(){
    for(let i=0;i<15;i++){
        let bubble=document.createElement('div');
        bubble.classList.add('bubble');
        bubble.style.left=Math.random()*100+'%';
        bubble.style.animationDuration=(5+Math.random()*5)+'s';
        bubble.style.width=bubble.style.height=(20+Math.random()*40)+'px';
        document.body.appendChild(bubble);
    }
}
createBubbles();

function createBubbles(){
    for(let i=0;i<15;i++){
        let bubble=document.createElement('div');
        bubble.classList.add('bubble');
        bubble.style.left=Math.random()*100+'%';
        bubble.style.animationDuration=(5+Math.random()*5)+'s';
        bubble.style.width=bubble.style.height=(20+Math.random()*40)+'px';
        document.body.appendChild(bubble);
    }
}
createBubbles();


async function login(){
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    console.log("Sending:", username, password);

    try {
        let res = await fetch("http://localhost:5000/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ username, password })
        });

        console.log("Status:", res.status);

        // 🔥 SAFE PARSE
        let text = await res.text();
        console.log("Raw response:", text);

        let data;
        try {
            data = JSON.parse(text);
        } catch {
            alert("Server returned invalid data");
            return false;
        }

        if(res.ok){
            localStorage.setItem("userId", data.user.id);
            localStorage.setItem("username", data.user.username);

            // ✅ FIRST TEST REDIRECT
            window.location.href = "home.html";

        } else {
            alert(data.message);
        }

    } catch(err){
        console.error("FETCH ERROR:", err);
        alert("Cannot connect to server");
    }

    return false;
}
</script>
<link rel="stylesheet" href="style.css">
</body>
</html>
