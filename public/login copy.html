<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ✅ YOUR STYLE KEPT */
body{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);}
.container{width:350px;padding:40px;border-radius:20px;background:rgba(255,255,255,0.1);backdrop-filter:blur(15px);text-align:center;}
input{width:100%;margin-bottom:15px;padding:10px;}
button{width:100%;padding:10px;}
</style>
</head>

<body>

<div class="container">
<h2>Login</h2>

<form onsubmit="login(event)">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<p><a href="register.html">Register</a></p>
</div>

<script>
async function login(event){
    event.preventDefault();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    try {
        let res = await fetch("https://mini-social-media-08pz.onrender.com/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ username, password })
        });

        let data = await res.json();

        if(res.ok){
            localStorage.setItem("userId", data.user.id);
            localStorage.setItem("username", data.user.username);
            window.location.href = "home.html";
        } else {
            alert(data.message);
        }

    } catch(err){
        alert("Login failed ❌");
    }
}
</script>

</body>
</html>
