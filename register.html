<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Spidyzz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ✅ YOUR ORIGINAL STYLE (UNCHANGED) */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);overflow:hidden;}
.container{width:350px;padding:40px;border-radius:20px;background:rgba(255,255,255,0.1);backdrop-filter:blur(15px);box-shadow:0 25px 45px rgba(0,0,0,0.2);text-align:center;animation:fadeIn 1s ease;}
h2{color:#fff;margin-bottom:30px;}
.inputBox{position:relative;margin-bottom:30px;}
.inputBox input{width:100%;padding:10px 0;background:transparent;border:none;border-bottom:2px solid #fff;color:#fff;outline:none;font-size:16px;}
.inputBox label{position:absolute;top:0;left:0;color:#fff;pointer-events:none;transition:0.5s;}
.inputBox input:focus ~ label,.inputBox input:valid ~ label{top:-20px;font-size:12px;color:#00f7ff;}
button{width:100%;padding:12px;border:none;border-radius:30px;background:linear-gradient(45deg,#00f7ff,#00ff88);color:#000;font-weight:600;cursor:pointer;}
.extra{margin-top:15px;color:#fff;font-size:14px;}
.extra a{color:#00f7ff;text-decoration:none;}
</style>
</head>

<body>

<div class="container">
<h2>Create Account</h2>

<form onsubmit="registerUser(event)">
    <div class="inputBox">
        <input type="text" id="fullname" required>
        <label>Full Name</label>
    </div>

    <div class="inputBox">
        <input type="text" id="username" required>
        <label>Username</label>
    </div>

    <div class="inputBox">
        <input type="password" id="password" required>
        <label>Password</label>
    </div>

    <button type="submit">Register</button>

    <div class="extra">
        Already have an account? <a href="login.html">Login</a>
    </div>
</form>
</div>

<script>
async function registerUser(event){
    event.preventDefault();

    let fullname = document.getElementById("fullname").value;
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    try {
        let res = await fetch("https://mini-social-media-08pz.onrender.com/api/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({fullname, username, password})
        });

        let data = await res.json();
        alert(data.message);

        if(res.ok){
            window.location.href = "login.html";
        }
    } catch (err) {
        alert("Register failed ❌");
    }
}
</script>

</body>
</html>
