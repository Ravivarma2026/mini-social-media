<!DOCTYPE html>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    height:100vh;
    color:#fff;
}

/* Sidebar (same style) */
.sidebar{
    width:250px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    padding:20px;
}

.sidebar h2{
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    color:#fff;
    text-decoration:none;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.2);
}

/* MAIN CHAT LAYOUT */
.chat-container{
    display:flex;
    width:100%;
}

/* LEFT USER LIST */
.chat-list{
    width:300px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    padding:15px;
    overflow-y:auto;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.user:hover{
    background:rgba(255,255,255,0.2);
}

/* PROFILE */
.user img{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
}

/* RIGHT CHAT AREA */
.chat-box{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:15px;
}

/* HEADER */
.chat-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.chat-header img{
    width:45px;
    height:45px;
    border-radius:50%;
}

/* MESSAGES AREA */
.messages{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

/* MESSAGE BUBBLES */
.msg{
    max-width:60%;
    padding:10px;
    border-radius:15px;
    margin-bottom:10px;
}

.sent{
    background:#00c6ff;
    align-self:flex-end;
    border-bottom-right-radius:5px;
}

.received{
    background:rgba(255,255,255,0.2);
    align-self:flex-start;
    border-bottom-left-radius:5px;
}

/* INPUT */
.input-box{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.input-box input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:20px;
    outline:none;
}

.input-box button{
    padding:10px 15px;
    border:none;
    border-radius:20px;
    background:#ff00cc;
    color:#fff;
    cursor:pointer;
}

.input-box button:hover{
    background:#ff4dd2;
}
</style>

</head>

<body>

<script>
let currentUser = "Siva";

// OPEN CHAT
function openChat(name, img){
    document.getElementById("chatName").innerText = name;
    document.getElementById("chatImg").src = img;

    currentUser = name;
    loadMessages();
}

// LOAD MESSAGES
async function loadMessages(){
    let me = localStorage.getItem("username");

    if(!me) return;

    let res = await fetch(`http://localhost:5000/api/messages/${me}/${currentUser}`);
    let messages = await res.json();

    let box = document.getElementById("messages");
    box.innerHTML = "";

    messages.forEach(msg => {
        let div = document.createElement("div");

        if(msg.sender === me){
            div.className = "msg sent";
        } else {
            div.className = "msg received";
        }

        div.innerText = msg.text;
        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

// SEND MESSAGE (FIXED)
async function sendMsg(){

    let input = document.getElementById("msgInput");
    let text = input.value.trim();

    if(text === "") return;

    let sender = localStorage.getItem("username");

    if(!sender){
        alert("Username not found in localStorage");
        return;
    }

    try {
        await fetch("http://localhost:5000/api/messages", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
                sender: sender,
                receiver: currentUser,
                text: text
            })
        });

        input.value = "";
        loadMessages();

    } catch(err){
        console.log("Send failed:", err);
        alert("Message send failed");
    }
}

// ENTER KEY SEND
document.getElementById("msgInput").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        sendMsg();
    }
});

// INIT
loadMessages();

</script>
